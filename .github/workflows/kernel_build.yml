name: Build M31 Kernel (Permissive)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    name: "Build for M31 | KSU=0 | OLD=1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Kolkata"

      - name: Setup Neutron Clang toolchain
        run: |
          sudo apt update
          sudo apt install bison flex libssl-dev libarchive-tools -y
          mkdir -p toolchain
          cd toolchain
          echo 'Download antman and sync'
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=05012024
          echo 'Done'

      - name: Run build (M31 only)
        run: |
          DEVICE=m31 KSU=0 OLD=1 ./build.sh -c

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: N_kernel-m31_Clang_18
          path: AnyKernel3/N*.zipname: Build M31 Kernel (Permissive)

on:
  workflow_dispatch:   # Lets you start the build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
            gperf build-essential zip curl zlib1g-dev g++-multilib \
            libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool \
            make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-simple-perl \
            bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip

      - name: Setup Android NDK (Clang)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e   # Older NDK for compatibility with Samsung kernel
          add-to-path: false

      - name: Set environment variables
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "CROSS_COMPILE=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Build kernel (M31 only)
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          ANDROID_MAJOR_VERSION: q   # Android Q (10) – adjust if needed
          PLATFORM_VERSION: 10.0.0

      - name: Collect build artifacts
        run: |
          mkdir -p output
          # Common output paths – adjust based on your build script
          cp arch/arm64/boot/Image output/ 2>/dev/null || true
          cp arch/arm64/boot/Image.gz output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image* output/ 2>/dev/null || true
          # If the build script produces boot.img directly, copy that too
          cp boot.img output/ 2>/dev/null || true
          ls -la output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M31-Kernel-Permissive
          path: output/
